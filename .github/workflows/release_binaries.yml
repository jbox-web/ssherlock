---
name: Release Binaries

on:
  push:
    tags:
      - '*'

jobs:
  release_linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Build static binaries
        run: mise release:static

      - name: Create release and publish assets
        uses: ncipollo/release-action@v1
        with:
          artifacts: "packages/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true

  release_macos_arm64:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install libssh2 and bdw-gc
        run: brew install libssh2 bdw-gc

      - name: Setup mise
        uses: jdx/mise-action@v4

      # TODO: remove me when https://github.com/crystal-lang/crystal/issues/16746 is fixed
      - name: Fix Crystal shards
        run: mise dev:fix-shards-command

      - name: Build binary
        run: mise release:build
        env:
          OUTPUT_FILE: bin/ssherlock-darwin-arm64

      - name: Create release and publish assets
        uses: ncipollo/release-action@v1
        with:
          artifacts: "bin/ssherlock-darwin-arm64*"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true

  release_macos_amd64:
    runs-on: macos-26-intel
    permissions:
      contents: write
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install libssh2 and bdw-gc
        run: brew install libssh2 bdw-gc

      - name: Setup mise
        uses: jdx/mise-action@v4

      # TODO: remove me when https://github.com/crystal-lang/crystal/issues/16746 is fixed
      - name: Fix Crystal shards
        run: mise dev:fix-shards-command

      - name: Build binary
        run: mise release:build
        env:
          OUTPUT_FILE: bin/ssherlock-darwin-amd64

      - name: Create release and publish assets
        uses: ncipollo/release-action@v1
        with:
          artifacts: "bin/ssherlock-darwin-amd64*"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
